[tool.poetry]
name = "smush-gnn"
version = "0.1.0"
description = "Adaptive anti-oversmoothing controller for deep GNNs (SmuSH)."
authors = ["Research Engineer <research@example.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.0"
torch-geometric = "*"
ogb = "*"
networkx = "*"
pyyaml = "*"
matplotlib = "*"
seaborn = "*"
numpy = "*"
ptflops = "*"
GraphRicciCurvature = {version = "*", optional = true}

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"